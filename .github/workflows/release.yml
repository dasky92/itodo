name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # Map Go architecture names to common system names
          ARCH_NAME="${{ matrix.goarch }}"
          if [ "$ARCH_NAME" = "amd64" ]; then
            ARCH_NAME="x86_64"
          elif [ "$ARCH_NAME" = "arm64" ] && [ "${{ matrix.goos }}" = "linux" ]; then
            ARCH_NAME="aarch64"
          fi

          # Build binary with full name (no compression as per user request)
          OUTPUT_NAME="itodo-${{ matrix.goos }}-${ARCH_NAME}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          
          go build -o "$OUTPUT_NAME" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: itodo-${{ matrix.goos }}-${ARCH_NAME}
          path: itodo-*
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: itodo-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            itodo-*
          generate_release_notes: true
