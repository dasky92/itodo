name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # Map Go architecture names to common system names
          ARCH_NAME="${{ matrix.goarch }}"
          if [ "$ARCH_NAME" = "amd64" ]; then
            ARCH_NAME="x86_64"
          elif [ "$ARCH_NAME" = "arm64" ] && [ "${{ matrix.goos }}" = "linux" ]; then
            ARCH_NAME="aarch64"
          fi

          BINARY_NAME="itodo-${{ matrix.goos }}-${ARCH_NAME}"
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          
          go build -o "$BINARY_NAME" .
          
          # Compress binary for all platforms
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${BINARY_NAME%.exe}.zip" "$BINARY_NAME"
            rm "$BINARY_NAME"
          else
            tar -czf "${BINARY_NAME}.tar.gz" "$BINARY_NAME"
            rm "$BINARY_NAME"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: itodo-*
          generate_release_notes: true